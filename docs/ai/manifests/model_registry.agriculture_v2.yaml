schema_version: "1.0"
manifest_type: "model_registry"
manifest_generation: "v1"
context: "agriculture"
modality: "computer_vision"
created: "2026-10-14"
mission: "AI_R1_EXECUTION"
notes: >
  Índice de artefactos de modelo. Registra la HUELLA y la DIRECCIÓN del artefacto,
  nunca sus binarios. Complementa a baseline_experiment_manifest.yaml (que describe
  el experimento), no lo sustituye.

dataset_inputs:
  dataset_id: "agriculture_images_tomato-potato-corn"
  dataset_version: "v1"
  taxonomy_version: "agriculture_v2_taxonomy_v1"
  split_version: "agriculture_v2_split_v1"

governance:
  gate: "M1_BASELINE_M2_CHALLENGER"
  serving_strategy: "AI_SERVING_ONNX"
  serving_note: >-
    servir != promover. Hoy el ai_service sirve el .h5 legacy por mtime
    (plant_disease_mbv2_h5) y NINGUN artefacto de benchmark/ esta servido.
  artifact_home: "benchmark/runs/  (ruta ignorada por git)"
  weight_policy: "binarios fuera de git; docs versionan ruta + sha256"
  # L-6 (2026-10-30): espejo de ejecucion del registro de procedencia.
  # El contenedor ai_service NO contiene docs/ (Dockerfile hace COPY . . del
  # directorio del microservicio), por lo que el estado se resuelve en runtime
  # desde src/ai_models/model_identity.py. AC-L13 exige que ambos hashes coincidan.
  runtime_registry: "src/ai_models/model_identity.py"
  status_vocabulary: ["HISTORICO", "CANONICO", "NO_DECLARADO", "INCONSISTENTE", "NO_DISPONIBLE"]
  status_alias_policy: "HISTORICAL (solo documental) -> HISTORICO; cualquier otro valor -> NO_DECLARADO"

class_index_map:
  order_source: "torchvision.ImageFolder (sorted)"
  taxonomy_version: "agriculture_v2_taxonomy_v1"
  classes:
    - "corn__cercospora_gray_leaf_spot"
    - "corn__common_rust"
    - "corn__healthy"
    - "corn__northern_leaf_blight"
    - "potato__early_blight"
    - "potato__healthy"
    - "potato__late_blight"
    - "tomato__bacterial_spot"
    - "tomato__early_blight"
    - "tomato__healthy"
    - "tomato__late_blight"
    - "tomato__leaf_mold"
    - "tomato__mosaic_virus"
    - "tomato__septoria_leaf_spot"
    - "tomato__target_spot"
    - "tomato__yellow_leaf_curl_virus"

