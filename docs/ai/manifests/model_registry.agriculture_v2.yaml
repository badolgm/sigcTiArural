      # contrato (AI-R3 + AI-R4) no puede cerrarse. Al vencer, re-evaluar.
      # C-3/C-4 (DOCKER_READY_CONDITIONAL): dueno, fecha, caducidad y disparador.
      owner: "Bernardo"
      declared_on: "2026-10-30"
      expires_on: "AI-R3+R4"
      trigger: "AI-R3 + AI-R4 ejecutados, o decision B-1 (registry vs OCI)"
      on_expiry: "revisar serving != promover; migrar a artefacto canonico o re-registrar"

