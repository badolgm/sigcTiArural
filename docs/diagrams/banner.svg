<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SIGC&amp;T Rural — Ecosistema Integrado de Ciencia y Tecnología Rural">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ff3cc7"/>
      <stop offset="100%" stop-color="#a3ff12"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ff3cc7"/>
      <stop offset="100%" stop-color="#a3ff12"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>
    <filter id="blurBlob" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00e5ff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="18" fill="url(#bgGrad)"/>

  <circle cx="140" cy="55" r="170" fill="#00e5ff" opacity="0.10" filter="url(#blurBlob)"/>
  <circle cx="1080" cy="255" r="190" fill="#ff3cc7" opacity="0.09" filter="url(#blurBlob)"/>
  <circle cx="960" cy="40" r="110" fill="#a3ff12" opacity="0.06" filter="url(#blurBlob)"/>

  <rect x="0" y="0" width="1200" height="300" rx="18" fill="url(#grid)"/>

  <rect x="2" y="2" width="1196" height="296" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.55"/>

  <g transform="translate(300,150)">
    <polygon points="42,0 21,36.4 -21,36.4 -42,0 -21,-36.4 21,-36.4"
             fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.85"/>
    <line x1="-15" y1="-15" x2="15" y2="-15" stroke="#7fd8ff" stroke-width="1.4" opacity="0.8"/>
    <line x1="-15" y1="-15" x2="0" y2="15" stroke="#7fd8ff" stroke-width="1.4" opacity="0.8"/>
    <line x1="15" y1="-15" x2="0" y2="15" stroke="#7fd8ff" stroke-width="1.4" opacity="0.8"/>
    <circle cx="-15" cy="-15" r="5" fill="#00e5ff" filter="url(#dotGlow)"/>
    <circle cx="15" cy="-15" r="5" fill="#ff3cc7" filter="url(#dotGlow)"/>
    <circle cx="0" cy="15" r="5" fill="#a3ff12" filter="url(#dotGlow)"/>
  </g>

  <text x="380" y="168" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="58" font-weight="800"
        fill="#f2f8fb" filter="url(#titleGlow)">SIGC&amp;T Rural</text>

  <rect x="382" y="182" width="360" height="4" rx="2" fill="url(#accentBar)"/>

  <text x="600" y="225" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="23" font-weight="500" fill="#a0b4c0">Ecosistema Integrado de Ciencia y Tecnología Rural</text>

  <text x="600" y="258" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="14" font-weight="600" letter-spacing="2.5" fill="#6fd8e8">ECOSISTEMA DDD · AGNÓSTICO DE HARDWARE · LABORATORIOS INTERCONECTADOS</text>
</svg>
